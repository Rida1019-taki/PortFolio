<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="50%" stop-color="#09090B" />
      <stop offset="100%" stop-color="#040405" />
    </linearGradient>
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ambient Glow -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="url(#bgGrad)" stroke="url(#goldGradient)" stroke-width="3" filter="url(#bloom)" />
  
  <!-- Inner Technical Border Grid -->
  <rect x="11" y="11" width="78" height="78" rx="20" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3 3" />

  <!-- Monogram R + T Typography Mark -->
  <g fill="url(#goldGradient)" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.8))">
    <!-- Letter R Stem -->
    <path d="M 28 28 L 36 28 L 36 72 L 28 72 Z" />
    
    <!-- Letter R Upper Bowl -->
    <path d="M 36 28 L 52 28 C 58 28 62 32 62 39 C 62 46 58 50 52 50 L 36 50 Z M 36 35 L 36 43 L 50 43 C 53 43 55 41 55 39 C 55 37 53 35 50 35 Z" />
    
    <!-- Letter R Diagonal Leg -->
    <path d="M 46 48 L 62 72 L 53 72 L 39 50 Z" />

    <!-- Letter T Top Bar -->
    <path d="M 56 28 L 76 28 L 76 35 L 56 35 Z" />
    
    <!-- Letter T Vertical Stem -->
    <path d="M 68 35 L 75 35 L 75 72 L 68 72 Z" />
  </g>

  <!-- Mini Tech Accent Dots / Brackets -->
  <circle cx="21" cy="50" r="1.5" fill="#F59E0B" opacity="0.6" />
  <circle cx="79" cy="50" r="1.5" fill="#F59E0B" opacity="0.6" />
</svg>
